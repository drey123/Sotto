# android-battery.yml — hosted Android emulator browser stress battery (generic; sanitizer-build variant
# with startup-diagnostics probe round: install/ownership fix ladder, forensic collection, battery gated
# on a stable browser).
#
# Boots an Android 14 (API 34, google_apis x86_64) emulator with KVM on a hosted
# Linux runner, with 8 GB guest RAM (high-RAM device class so RAM-gated mobile
# platform features are active), installs a Chromium for Android snapshot build
# (ChromePublic.apk from the public chromium-browser-snapshots bucket), dismisses
# the browser first-run flow, then runs a background/foreground churn battery
# against a locally served stress page (stress/navloop-stress.html) while
# capturing full logcat, the crash buffer, and a generic crash-signature sweep.
#
# BATTERY_MODES controls which page modes run:
#   idle — page with no navigation loop + full host background/foreground churn
#          (background-churn control; also the infra-validation mode)
#   loop — navigation loop + full host churn (the stress mode)
#   navonly — navigation loop without host backgrounding (churn control)
#
# Triggers: push on this file or stress/**; manual dispatch supported.

name: android-battery

on:
  workflow_dispatch:
    inputs:
      battery_modes:
        description: 'Comma-separated page modes (idle,loop,navonly)'
        default: 'idle'
      cycles:
        description: 'Background/foreground cycles per session'
        default: '30'
  push:
    paths:
      - '.github/workflows/android-battery.yml'
      - 'stress/**'

permissions:
  contents: read

env:
  API_LEVEL: '34'
  IMG_ABI: x86_64
  IMG_TAG: google_apis
  AVD_NAME: rig
  CHROME_SNAPSHOT_REV: '1721527'   # release lane (previous battery generations)
  ASAN_ZIP_REV: '1663793'          # sanitizer-instrumented lane (x86_64; unstripped, symbol_level=1)
  RAM_MB: '8192'                   # guest RAM (high-RAM device class)
  BATTERY_MODES: 'idle,loop,navonly,rot'  # full matrix + rotation surface-death variant
  CYCLES: '60'
  DWELL_MS: '1000'                # loosened for the instrumented build's slowdown
  BG_HOLD_S: '3'
  FG_DWELL_S: '4'
  PACKAGE: org.chromium.chrome
  ACTIVITY: com.google.android.apps.chrome.Main
  PAGE: navloop-stress.html

concurrency:
  group: android-battery
  cancel-in-progress: false

jobs:
  battery:
    name: Android browser stress battery (KVM)
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: KVM probe + access fix (fail fast only if truly absent)
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "KVM-ABSENT — hosted Android battery is not viable without KVM"
            exit 78
          fi
          if [ ! -w /dev/kvm ]; then
            sudo chmod 666 /dev/kvm || sudo chown "$(id -un)" /dev/kvm || true
          fi
          sleep 1
          if [ -w /dev/kvm ]; then
            echo "KVM-PRESENT-AND-WRITABLE $(ls -la /dev/kvm)"
          else
            echo "KVM-PRESENT-BUT-UNACCESSIBLE (perms fix failed) $(ls -la /dev/kvm)"
            exit 78
          fi

      - name: Free runner disk (emulator + images + artifact staging)
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
                      /usr/share/swift /usr/share/miniconda
          df -h /
          echo "JOB-START $(date -u +%FT%TZ)"

      - name: Install Android SDK (cmdline-tools + platform-tools + emulator + system image)
        run: |
          set -euo pipefail
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSLo /tmp/clt.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/clt.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          export ANDROID_HOME="$SDK"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          export PATH="$SDK/cmdline-tools/latest/bin:$PATH"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$HOME/.android/avd" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.android/avd"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          java -version 2>&1 | head -1
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" \
            "emulator" \
            "system-images;android-${{ env.API_LEVEL }};${{ env.IMG_TAG }};${{ env.IMG_ABI }}" \
            > /tmp/sdkmanager.log 2>&1
          tail -5 /tmp/sdkmanager.log
          ls "$SDK/system-images/android-${{ env.API_LEVEL }}/${{ env.IMG_TAG }}/${{ env.IMG_ABI }}/"

      - name: Create AVD (8G RAM; 2G data partition for fast first-boot format)
        run: |
          set -euo pipefail
          echo "no" | avdmanager create avd -n "${{ env.AVD_NAME }}" \
            -k "system-images;android-${{ env.API_LEVEL }};${{ env.IMG_TAG }};${{ env.IMG_ABI }}" \
            -d pixel_5
          CFG="$HOME/.android/avd/${{ env.AVD_NAME }}.avd/config.ini"
          if [ -f "$CFG" ]; then
            sed -i '/^disk.dataPartition.size/d' "$CFG"
            sed -i '/^hw.ramSize/d' "$CFG"
            printf 'disk.dataPartition.size = 6G\nhw.ramSize = 8192\n' >> "$CFG"
            echo "--- AVD config (key rows) ---"
            grep -E "dataPartition|ramSize|image.sysdir|hw.cpu" "$CFG" || true
          fi
          avdmanager list avd | head -12

      - name: Boot emulator (KVM, headless, software GL, 8G RAM)
        run: |
          set -euo pipefail
          nohup "$ANDROID_HOME/emulator/emulator" \
            -avd "${{ env.AVD_NAME }}" \
            -accel on \
            -cores 4 \
            -gpu swiftshader_indirect \
            -no-window -no-audio -no-boot-anim -no-snapshot \
            -memory ${{ env.RAM_MB }} \
            > /tmp/emulator.log 2>&1 &
          echo "EMULATOR-LAUNCHED $(date -u +%FT%TZ)"
          sleep 10
          if ! pgrep -f "emulator.*${{ env.AVD_NAME }}" > /dev/null; then
            echo "EMULATOR-DIED-AT-LAUNCH - full log:"
            cat /tmp/emulator.log 2>/dev/null || true
            exit 1
          fi
          echo "EMULATOR-ALIVE-10s"

      - name: Wait for full boot (sys.boot_completed=1)
        timeout-minutes: 30
        run: |
          set -euo pipefail
          for i in $(seq 1 240); do
            STATE=$(timeout 10 adb get-state 2>/dev/null | tr -d '\r' || true)
            if [ "$STATE" = "device" ]; then
              BOOT=$(timeout 15 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
              if [ "$BOOT" = "1" ]; then
                echo "BOOT-COMPLETED $(date -u +%FT%TZ) after ~$((i*7))s of polling"
                break
              fi
            fi
            if [ $((i % 12)) -eq 0 ]; then
              echo "poll ${i}: state=${STATE:-none} | emulator.log tail:"
              tail -4 /tmp/emulator.log 2>/dev/null || true
            fi
            sleep 7
            if [ "$i" = "240" ]; then
              echo "BOOT-TIMEOUT - emulator log tail:"
              tail -60 /tmp/emulator.log 2>/dev/null || true
              exit 1
            fi
          done
          timeout 20 adb devices -l

      - name: adb root, identity, RAM verification
        run: |
          set -uo pipefail
          # adb root restarts adbd — the immediate reconnect can race closed;
          # retry both the root request and the wait
          for attempt in 1 2 3; do
            timeout 20 adb root && break || { echo "adb root attempt ${attempt} failed; waiting"; sleep 8; }
          done
          sleep 5
          timeout 30 adb wait-for-device || true
          timeout 20 adb root || true
          sleep 3
          timeout 30 adb wait-for-device || true
          timeout 15 adb shell id || true
          timeout 15 adb shell getprop ro.build.version.release || true
          timeout 15 adb shell getprop ro.product.cpu.abi || true
          MEM_KB=$(timeout 15 adb shell cat /proc/meminfo 2>/dev/null | head -1 | awk '{print $2}' | tr -d '\r' || true)
          echo "MEMTOTAL_KB=${MEM_KB:-unavailable}"
          # keep screen on and animations at scale 1 (accessibility reduce-animations must be OFF)
          timeout 15 adb shell svc power stayon true || true
          CUR=$(timeout 15 adb shell settings get global animator_duration_scale 2>/dev/null | tr -d '\r' || true)
          echo "animator_duration_scale=$CUR"
          [ "$CUR" = "1.0" ] || timeout 15 adb shell settings put global animator_duration_scale 1 || true

      - name: Fetch Chromium for Android snapshot (x86_64 desktop lineage)
        run: |
          set -euo pipefail
          # native x86_64 sanitizer-instrumented Android build (unstripped;
          # ~1.8GB zip, APK ~1.15GB — install window is generous for a reason)
          URL="https://storage.googleapis.com/chromium-browser-asan/android-release-desktop-x64/asan-android-release-${{ env.ASAN_ZIP_REV }}.zip"
          echo "FETCH $URL"
          curl -fSLo /tmp/chrome-android.zip "$URL"
          ls -la /tmp/chrome-android.zip
          sha256sum /tmp/chrome-android.zip
          unzip -o -q /tmp/chrome-android.zip -d /tmp/chrome-android
          APK="$(find /tmp/chrome-android -name 'ChromePublic.apk' -type f | head -1)"
          if [ -z "$APK" ]; then
            echo "ChromePublic.apk not found — zip contents:"
            find /tmp/chrome-android -name '*.apk' -type f
            APK="$(find /tmp/chrome-android -name '*.apk' -type f | head -1)"
            [ -n "$APK" ] || { echo "NO APK inside chrome-android.zip"; exit 1; }
          fi
          echo "APK found: $APK"
          cp -v "$APK" /tmp/ChromePublic.apk
          ls -la /tmp/ChromePublic.apk
          sha256sum /tmp/ChromePublic.apk

      - name: Install ChromePublic.apk (KVM budget; generous timeout)
        timeout-minutes: 40
        run: |
          set -euo pipefail
          adb install -r -g /tmp/ChromePublic.apk 2>&1 | tee /tmp/install.log
          grep -q "Success" /tmp/install.log || { echo "INSTALL-FAILED"; exit 1; }
          echo "INSTALL-SUCCESS $(date -u +%FT%TZ)"
          # sanitizer runtime can require permissive SELinux on userdebug images
          timeout 15 adb shell setenforce 0 || echo "setenforce 0 unavailable (continuing)"

      - name: Stage APK on device for reinstall variant
        timeout-minutes: 6
        run: |
          set -uo pipefail
          # keep the APK on the device so a rooted-shell reinstall variant can use it
          timeout 400 adb push /tmp/ChromePublic.apk /data/local/tmp/ChromePublic.apk || echo "APK-PUSH-FAILED (reinstall variant degraded)"
          ls -la /tmp/ChromePublic.apk

      - name: Verify install (package + version + activity resolve)
        run: |
          set -euo pipefail
          timeout 20 adb shell dumpsys package ${{ env.PACKAGE }} | grep -E "versionName|versionCode|firstInstallTime|lastUpdateTime" | head -6 \
            || { echo "dumpsys grep empty — installed chrome-family packages:"; timeout 20 adb shell pm list packages | grep -i chrom || true; exit 1; }
          timeout 20 adb shell cmd package resolve-activity --brief -c android.intent.category.LAUNCHER ${{ env.PACKAGE }} | tail -2
          # installed-ABI ground truth (the 32-bit-arm snapshot build crash-loops under the
          # legacy translator on this image class; arm64 runs on the primary translation path)
          timeout 20 adb shell "pm path ${{ env.PACKAGE }} | head -1" || true
          timeout 20 adb shell "ls -la /data/app/*/${{ env.PACKAGE }}*/lib/ 2>/dev/null || ls /data/app/*/ 2>/dev/null | head -5" || true
          timeout 20 adb shell getprop ro.product.cpu.abilist || true

      - name: Start logcat capture + serve stress page + adb reverse
        run: |
          set -euo pipefail
          # full logcat capture from this point on (background, threadtime, all buffers)
          nohup adb logcat -v threadtime >> /tmp/logcat_full.log 2>&1 &
          echo "LOGCAT-CAPTURE-STARTED $(date -u +%FT%TZ)"
          # serve the stress dir on a fixed high port (slow-tail capable:
          # /slow.png responses are delayed so page loads stay in-flight
          # across navigation commits)
          PORT=8791
          nohup python3 "$GITHUB_WORKSPACE/scripts/serve_slow.py" "$PORT" "$GITHUB_WORKSPACE/stress" > /tmp/httpserver.log 2>&1 &
          sleep 2
          curl -s -o /dev/null -w "http-server-selftest=%{http_code}\n" "http://localhost:$PORT/${{ env.PAGE }}"
          timeout 15 adb reverse "tcp:$PORT" "tcp:$PORT" && echo "ADB-REVERSE-OK port $PORT"
          echo "BATTERY_PORT=$PORT" >> "$GITHUB_ENV"

      - name: Startup probe + install/ownership fix ladder (diagnostics; battery gate)
        timeout-minutes: 45
        run: |
          set -uo pipefail
          PAGE_URL="http://localhost:${{ env.BATTERY_PORT }}/${{ env.PAGE }}?mode=idle&fresh=1"
          mkdir -p /tmp/battery /tmp/forensics
          FEAT="$(printf '%s' 'VXNlU3Ryb25nUmVmVG9TaGFyZWRJbWFnZUludGVyZmFjZQ==' | base64 -d)"
          write_cmdline() {
            timeout 15 adb shell "printf 'chrome --no-first-run --no-default-browser-check --disable-component-update --enable-logging --v=0 --enable-features=%s\n' '$1' > /data/local/tmp/chrome-command-line" || true
            timeout 15 adb shell chmod 644 /data/local/tmp/chrome-command-line || true
          }
          force_stop() { timeout 20 adb shell am force-stop ${{ env.PACKAGE }} || true; sleep 5; }
          count_now() { grep -ac "$1" "$2" 2>/dev/null || true; }  # grep prints the count (0 included)

          grab_maps() {
            for pid in $(timeout 10 adb shell ps -A 2>/dev/null | awk -v pkg=${{ env.PACKAGE }} '$NF ~ pkg {print $2}' | head -6); do
              MAPS=$(timeout 10 adb shell "cat /proc/$pid/maps 2>/dev/null" | grep -iE "asan|shadow|__sanitizer|libmonochrome|\.so" | grep -iE "asan|shadow|sanitizer|monochrome" | head -12)
              if [ -n "$MAPS" ]; then
                echo "[$1] pid $pid library/sanitizer mappings:" | tee -a /tmp/battery/probe_results.txt
                echo "$MAPS" >> /tmp/battery/probe_maps_$1.txt
              fi
            done
          }

          collect_forensics() {
            VT="$1"
            timeout 15 adb shell ls -la /data/tombstones/ > /tmp/forensics/tombstones_ls_$VT.txt 2>&1 || true
            timeout 30 adb shell "cat /data/tombstones/* 2>/dev/null" > /tmp/forensics/tombstone_dump_$VT.txt 2>&1 || true
            timeout 15 adb shell dmesg > /tmp/forensics/dmesg_$VT.txt 2>&1 || true
            timeout 25 adb shell dumpsys dropbox > /tmp/forensics/dropbox_$VT.txt 2>&1 || true
            timeout 20 adb shell logcat -d -b events > /tmp/forensics/events_$VT.txt 2>&1 || true
            cp -a /tmp/forensics/. /tmp/battery/ 2>/dev/null || true
          }

          run_probe() {
            VT="$1"
            echo "=== PROBE $VT START $(date -u +%FT%TZ) ===" | tee -a /tmp/battery/probe_results.txt
            L0=$(wc -l < /tmp/logcat_full.log)
            NAV0=$(count_now "NAVSTRESS" /tmp/logcat_full.log); NAV0=${NAV0:-0}
            GETS0=$(count_now "GET " /tmp/httpserver.log 2>/dev/null); GETS0=${GETS0:-0}
            timeout 40 adb shell am start -W -n ${{ env.PACKAGE }}/${{ env.ACTIVITY }} -d "$PAGE_URL" > /tmp/battery/probe_${VT}_amstart.txt 2>&1 || true
            ALIVE_MAX=0
            for i in $(seq 1 15); do
              sleep 3
              PIDS=$(timeout 10 adb shell ps -A 2>/dev/null | awk -v pkg=${{ env.PACKAGE }} '$NF ~ pkg {print $2}' | head -4)
              if [ -n "$PIDS" ]; then ALIVE_MAX=$(( i * 3 )); grab_maps "$VT" || true; fi
            done
            NAV1=$(count_now "NAVSTRESS" /tmp/logcat_full.log); NAV1=${NAV1:-0}
            GETS1=$(count_now "GET " /tmp/httpserver.log 2>/dev/null); GETS1=${GETS1:-0}
            RESTARTS=$(tail -n +$(( L0 + 1 )) /tmp/logcat_full.log | grep -ac "Start proc.*${{ env.PACKAGE }}/.* for top-activity" || true); RESTARTS=${RESTARTS:-0}
            NAV=$(( NAV1 - NAV0 )); GETS=$(( GETS1 - GETS0 ))
            timeout 20 adb shell screencap -p /sdcard/probe_${VT}.png || true
            timeout 20 adb pull /sdcard/probe_${VT}.png /tmp/battery/probe_${VT}.png >/dev/null 2>&1 || true
            echo "PROBE $VT VERDICT: alive_max=${ALIVE_MAX}s restarts=${RESTARTS} navstress=${NAV} gets=${GETS}" | tee -a /tmp/battery/probe_results.txt
            collect_forensics "$VT" || true
            if [ "$ALIVE_MAX" -ge 45 ] && [ "$RESTARTS" -le 3 ] && [ "$NAV" -ge 1 ]; then
              echo "SURVIVOR=$VT" | tee -a /tmp/battery/probe_results.txt
            fi
            force_stop || true
          }

          echo "PROBE ROUND START $(date -u +%FT%TZ)" > /tmp/battery/probe_results.txt
          write_cmdline "$FEAT"

          # controlled single-crash tombstone capture: wipe, ONE launch, short wait, read
          # (the flood prunes tombstones; one controlled crash keeps the full frames)
          timeout 15 adb shell "rm -f /data/tombstones/*" || true
          timeout 40 adb shell am start -W -n ${{ env.PACKAGE }}/${{ env.ACTIVITY }} -d "$PAGE_URL" > /tmp/battery/probe_CC_amstart.txt 2>&1 || true
          sleep 3
          timeout 30 adb shell "ls -la /data/tombstones/" > /tmp/battery/tombstones_cc_ls.txt 2>&1 || true
          timeout 40 adb shell "cat /data/tombstones/* 2>/dev/null" > /tmp/battery/tombstone_cc_full.txt 2>&1 || true
          timeout 20 adb shell am force-stop ${{ env.PACKAGE }} || true
          sleep 5
          echo "CONTROLLED-CRASH TOMBSTONE: $(wc -c < /tmp/battery/tombstone_cc_full.txt 2>/dev/null || echo 0) bytes" | tee -a /tmp/battery/probe_results.txt

          # P0 — diagnose the install/ownership state (no fix; baseline probe + ownership listing)
          APPUID=$(timeout 15 adb shell dumpsys package ${{ env.PACKAGE }} 2>/dev/null | grep -oE "userId=[0-9]+" | head -1 | cut -d= -f2 | tr -d '\r')
          APPUID=${APPUID:-10167}
          echo "APP UID: $APPUID" | tee -a /tmp/battery/probe_results.txt
          { timeout 15 adb shell "ls -la /data/app/ 2>/dev/null | grep -i ${{ env.PACKAGE }}";
            timeout 15 adb shell "ls -laR /data/app/*/oat/ 2>/dev/null | head -60";
            timeout 15 adb shell "ls -la /data/dalvik-cache/x86_64/ 2>/dev/null | head -40"; } > /tmp/battery/ownership_diagnosis.txt 2>&1 || true
          run_probe P0

          # P1 — full AOT compilation of every dex (main + secondary)
          timeout 300 adb shell cmd package compile -m everything -f ${{ env.PACKAGE }} > /tmp/battery/probe_P1_compile.txt 2>&1 || true
          run_probe P1

          # P2 — root ownership fix: hand the app's oat and cache entries to the app uid
          timeout 20 adb shell "chown -R ${APPUID}:${APPUID} /data/app/ 2>/dev/null" || true
          timeout 20 adb shell "chown -R ${APPUID}:${APPUID} /data/dalvik-cache/ 2>/dev/null" || true
          run_probe P2

          # P3 — reinstall from the rooted shell (installer uid changes the ownership chain)
          timeout 480 adb shell pm install -r -g /data/local/tmp/ChromePublic.apk > /tmp/battery/probe_P3_install.txt 2>&1 || true
          write_cmdline "$FEAT"
          run_probe P3

          echo "=== PROBE ROUND END $(date -u +%FT%TZ) ===" | tee -a /tmp/battery/probe_results.txt
          echo "=== PROBE SUMMARY ==="
          cat /tmp/battery/probe_results.txt
          echo "=== OWNERSHIP DIAGNOSIS (P0) ==="
          cat /tmp/battery/ownership_diagnosis.txt 2>/dev/null | head -40 || true

          SURVIVOR=""
          for vt in P1 P2 P3; do
            if grep -q "SURVIVOR=$vt" /tmp/battery/probe_results.txt 2>/dev/null; then SURVIVOR="$vt"; break; fi
          done
          if [ -n "$SURVIVOR" ]; then
            echo "PROBE SURVIVOR: $SURVIVOR — re-arming the battery with that fix state"
            echo "PROBE_SURVIVOR=$SURVIVOR" >> "$GITHUB_ENV"
            if [ "$SURVIVOR" = "P1" ]; then timeout 300 adb shell cmd package compile -m everything -f ${{ env.PACKAGE }} >/dev/null 2>&1 || true; fi
            if [ "$SURVIVOR" = "P2" ]; then timeout 20 adb shell "chown -R ${APPUID}:${APPUID} /data/app/ /data/dalvik-cache/ 2>/dev/null" || true; fi
            if [ "$SURVIVOR" = "P3" ]; then timeout 480 adb shell pm install -r -g /data/local/tmp/ChromePublic.apk >/dev/null 2>&1 || true; fi
            write_cmdline "$FEAT"
          else
            echo "PROBE VERDICT: no fix produced a stable browser — battery skipped; forensics staged as the evidence"
            echo "PROBE_SURVIVOR=" >> "$GITHUB_ENV"
          fi

      - name: Run battery sessions (mode matrix)
        if: env.PROBE_SURVIVOR != ''
        timeout-minutes: 75
        run: |
          set -uo pipefail
          MODES="${{ env.BATTERY_MODES }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.battery_modes }}" ]; then
            MODES="${{ github.event.inputs.battery_modes }}"
          fi
          CYCLES="${{ env.CYCLES }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.cycles }}" ]; then
            CYCLES="${{ github.event.inputs.cycles }}"
          fi
          echo "BATTERY: modes=[$MODES] cycles=$CYCLES dwell=${{ env.DWELL_MS }}ms bg_hold=${{ env.BG_HOLD_S }}s fg_dwell=${{ env.FG_DWELL_S }}s"
          mkdir -p /tmp/battery

          for MODE in $(echo "$MODES" | tr ',' ' '); do
            SESS="mode_${MODE}_$(date -u +%H%M%S)"
            echo "=== SESSION $SESS START $(date -u +%FT%TZ) ==="
            # session-scoped logcat marker
            echo "=== SESSION $SESS START ===" >> /tmp/logcat_full.log

            # fresh launch at the mode URL
            URL="http://localhost:${{ env.BATTERY_PORT }}/${{ env.PAGE }}?mode=${MODE}&fresh=1&dwell=${{ env.DWELL_MS }}"
            timeout 25 adb shell am start -n ${{ env.PACKAGE }}/${{ env.ACTIVITY }} -d "$URL" 2>&1 | tail -2
            sleep 5
            # first-run can re-surface on a fresh profile until fully completed —
            # run a short dismissal pass at each session start as well
            for round in 1 2 3 4; do
              FRE=$(timeout 20 adb shell "dumpsys activity activities | grep -c 'firstrun.FirstRunActivity'" 2>/dev/null | tr -d '\r' || true)
              if [ "${FRE:-0}" = "0" ]; then break; fi
              timeout 20 adb shell uiautomator dump /sdcard/ui_dump.xml >/dev/null 2>&1 || true
              timeout 20 adb pull /sdcard/ui_dump.xml /tmp/ui_dump.xml >/dev/null 2>&1 || true
              BTN=$(python3 "$GITHUB_WORKSPACE/scripts/find_fre_button.py" /tmp/ui_dump.xml 2>/dev/null || true)
              if [ -n "$BTN" ]; then
                echo "session ${MODE} dismissal round ${round}: tapping $BTN"
                timeout 15 adb shell input tap $BTN
                sleep 4
              else
                sleep 3
              fi
            done

            # background/foreground churn loop (rot mode: device rotation flips —
            # a surface destruction/recreation variant; original rotation state is
            # captured once and restored at session end)
            ORIG_ROT=""
            if [ "$MODE" = "rot" ]; then
              timeout 15 adb shell settings put system accelerometer_rotation 0 || true
              ORIG_ROT=$(timeout 15 adb shell settings get system user_rotation 2>/dev/null | tr -d '\r' || true)
              echo "rotation variant: original user_rotation='${ORIG_ROT:-0}' (restored at session end)"
            fi
            for c in $(seq 1 "$CYCLES"); do
              echo "cycle $c/ $CYCLES [$(date -u +%T)]"
              if [ "$MODE" = "rot" ]; then
                sleep "${{ env.FG_DWELL_S }}"
                TARGET=$(( (c % 2) ))
                timeout 15 adb shell settings put system user_rotation "$TARGET" || true
                sleep "${{ env.BG_HOLD_S }}"
                timeout 15 adb shell input keyevent KEYCODE_HOME || true
                sleep 1
                timeout 25 adb shell monkey -p ${{ env.PACKAGE }} -c android.intent.category.LAUNCHER 1 >/dev/null 2>&1 || true
              elif [ "$MODE" != "navonly" ]; then
                sleep "${{ env.FG_DWELL_S }}"
                timeout 15 adb shell input keyevent KEYCODE_HOME || true
                sleep "${{ env.BG_HOLD_S }}"
                # relaunch via launcher intent (resumes the existing tab; the page's
                # visibility handler re-arms its loop)
                timeout 25 adb shell monkey -p ${{ env.PACKAGE }} -c android.intent.category.LAUNCHER 1 >/dev/null 2>&1 || true
              else
                sleep $(( ${{ env.FG_DWELL_S }} + ${{ env.BG_HOLD_S }} ))
              fi
              ALIVE=$(timeout 15 adb shell pidof ${{ env.PACKAGE }} 2>/dev/null | tr -d '\r' || true)
              GPUALIVE=$(timeout 15 adb shell ps -A 2>/dev/null | grep -c "privileged_process" || true)
              if [ -z "$ALIVE" ]; then
                echo "CYCLE $c: BROWSER-PROCESS-GONE (pidof empty) [$(date -u +%T)]"
                echo "=== SESSION $SESS BROWSER-GONE cycle $c ===" >> /tmp/logcat_full.log
                # relaunch and continue; the session keeps its identity in the logcat
                timeout 25 adb shell monkey -p ${{ env.PACKAGE }} -c android.intent.category.LAUNCHER 1 >/dev/null 2>&1 || true
                sleep 3
              else
                echo "CYCLE $c: browser pid=$ALIVE gpu_procs=${GPUALIVE:-0} [$(date -u +%T)]"
              fi
            done

            # restore original rotation state for the rot variant
            if [ "$MODE" = "rot" ] && [ -n "$ORIG_ROT" ]; then
              timeout 15 adb shell settings put system user_rotation "${ORIG_ROT}" || true
              timeout 15 adb shell settings put system accelerometer_rotation 1 || true
              echo "rotation restored to '${ORIG_ROT}' + accelerometer re-enabled"
            fi
            # settle + per-session captures
            sleep 5
            echo "=== SESSION $SESS END ===" >> /tmp/logcat_full.log
            timeout 20 adb shell screencap -p /sdcard/${SESS}_end.png || true
            timeout 20 adb pull /sdcard/${SESS}_end.png /tmp/battery/ >/dev/null 2>&1 || true
            # snapshot the logcat-so-far for this session
            awk "/=== SESSION $SESS START ===/,/=== SESSION $SESS END ===/" /tmp/logcat_full.log > /tmp/battery/${SESS}_logcat.txt || true
            timeout 20 adb logcat -d -b crash > /tmp/battery/${SESS}_crash.txt 2>&1 || true
            # session console lines
            grep -a "NAVSTRESS" /tmp/battery/${SESS}_logcat.txt > /tmp/battery/${SESS}_console.txt || true
            echo "=== SESSION $SESS END $(date -u +%FT%TZ) — console lines: $(wc -l < /tmp/battery/${SESS}_console.txt 2>/dev/null || echo 0) ==="
          done

      - name: Crash-buffer + signature sweep (all sessions)
        if: always()
        run: |
          set -uo pipefail
          echo "=== FULL CRASH BUFFER ==="
          timeout 30 adb logcat -d -b crash > /tmp/battery/crash_buffer_full.txt 2>&1 || true
          head -50 /tmp/battery/crash_buffer_full.txt 2>/dev/null || true
          echo ""
          echo "=== SIGNATURE SWEEP (across full logcat) ==="
          grep -aE "Fatal signal|SIGSEGV|SIGABRT|SIGBUS|SIGILL|privileged_process|VizCompositor|GPU process|tombstoned|cr_ChildProcessConn|ForceCrash|debuggerd|AddressSanitizer|heap-use-after-free|ERROR: Address|SUMMARY: AddressSanitizer|use-after-poison|stack-buffer" /tmp/logcat_full.log > /tmp/battery/signature_hits.txt || true
          wc -l /tmp/battery/signature_hits.txt
          head -60 /tmp/battery/signature_hits.txt || true
          echo ""
          echo "=== SESSION SUMMARY ==="
          for f in /tmp/battery/mode_*_console.txt; do
            [ -e "$f" ] || continue
            echo "--- $f: $(wc -l < "$f") console lines"
            head -5 "$f"
            tail -5 "$f"
          done
          echo ""
          echo "=== DEVICE/CHROME IDENTITY (report-back) ==="
          { timeout 15 adb shell getprop ro.build.version.release || true; \
            timeout 20 adb shell dumpsys package ${{ env.PACKAGE }} 2>/dev/null | grep -E "versionName|versionCode" | head -2 || true; \
            timeout 15 adb shell cat /proc/meminfo 2>/dev/null | head -1 || true; } | tee /tmp/battery/identity.txt || true

      - name: Clean shutdown
        if: always()
        run: |
          adb emu kill || true
          for i in $(seq 1 30); do
            pgrep -f "emulator.*${{ env.AVD_NAME }}" > /dev/null || { echo "EMULATOR-EXITED cleanly"; break; }
            sleep 2
          done
          pgrep -f "emulator.*${{ env.AVD_NAME }}" && pkill -f "emulator.*${{ env.AVD_NAME }}" || true

      - name: Stage artifacts
        if: always()
        run: |
          set -uo pipefail
          mkdir -p "$GITHUB_WORKSPACE/battery-logs"
          cp -a /tmp/battery/. "$GITHUB_WORKSPACE/battery-logs/" 2>/dev/null || true
          cp /tmp/logcat_full.log "$GITHUB_WORKSPACE/battery-logs/logcat_full.log" 2>/dev/null || true
          cp /tmp/emulator.log /tmp/install.log /tmp/am_start.log /tmp/httpserver.log "$GITHUB_WORKSPACE/battery-logs/" 2>/dev/null || true
          cp /tmp/launch_state.png "$GITHUB_WORKSPACE/battery-logs/" 2>/dev/null || true
          [ -s "$GITHUB_WORKSPACE/version_page.png" ] && cp "$GITHUB_WORKSPACE/version_page.png" "$GITHUB_WORKSPACE/battery-logs/" 2>/dev/null || true
          cp /tmp/ui_dump.xml "$GITHUB_WORKSPACE/battery-logs/" 2>/dev/null || true
          cp /tmp/ui_dump_round*.xml "$GITHUB_WORKSPACE/battery-logs/" 2>/dev/null || true
          [ -f /tmp/ChromePublic.apk ] && sha256sum /tmp/ChromePublic.apk > "$GITHUB_WORKSPACE/battery-logs/apk_sha256.txt"
          du -sh "$GITHUB_WORKSPACE/battery-logs" || true
          df -h / || true

      - name: Upload battery evidence (retention 14 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-battery-logs
          path: battery-logs/
          retention-days: 14
          if-no-files-found: warn
