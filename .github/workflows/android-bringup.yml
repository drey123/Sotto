# android-bringup.yml — hosted Android virtual-device bring-up + browser install (generic).
#
# Boots an Android 11 (API 30, google_apis x86_64) emulator with KVM acceleration on a
# hosted Linux runner (4 vCPU / 16 GB RAM), installs a Chromium for Android snapshot
# build (ChromePublic.apk from the public chromium-browser-snapshots bucket), verifies
# the install, and publishes:
#   1. the post-install AVD (userdata + dexopt caches) as an artifact — any environment
#      can then boot the pre-installed device locally (software emulation is fine for a
#      warm boot; the expensive APK parse/install step is already done), and
#   2. boot/install logs as evidence.
#
# Triggers: push-triggered on edits to this file; manual dispatch supported.
#
# Why KVM is required: the 243 MB Chromium APK parse must finish inside the framework
# watchdog budget; software emulation (TCG) on hosted runners does not meet that budget.
# If /dev/kvm is absent the job fails fast with a clear marker (that is itself the
# measurement).

name: android-bringup

on:
  workflow_dispatch: {}
  push:
    paths:
      - '.github/workflows/android-bringup.yml'

permissions:
  contents: read

env:
  API_LEVEL: '30'
  IMG_ABI: x86_64
  IMG_TAG: google_apis
  AVD_NAME: rig
  CHROME_SNAPSHOT_REV: '1700587'   # chromium-browser-snapshots/Android rev to install

concurrency:
  group: android-bringup
  cancel-in-progress: false

jobs:
  bringup:
    name: Android VD bring-up (KVM) + browser install
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: KVM probe + access fix (fail fast only if truly absent)
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "KVM-ABSENT — hosted Android install is not viable without KVM"
            exit 78  # configuration error, recorded honestly
          fi
          # Device exists (root:kvm, mode 660). Grant the runner user access.
          if [ ! -w /dev/kvm ]; then
            sudo chmod 666 /dev/kvm || sudo chown "$(id -un)" /dev/kvm || true
          fi
          sleep 1
          if [ -w /dev/kvm ]; then
            echo "KVM-PRESENT-AND-WRITABLE $(ls -la /dev/kvm)"
          else
            echo "KVM-PRESENT-BUT-UNACCESSIBLE (perms fix failed) $(ls -la /dev/kvm)"
            exit 78
          fi

      - name: Free runner disk (emulator + images + artifact staging)
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
                      /usr/share/swift /usr/share/miniconda
          df -h /
          echo "JOB-START $(date -u +%FT%TZ)"

      - name: Install Android SDK (cmdline-tools + platform-tools + emulator + system image)
        run: |
          set -euo pipefail
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSLo /tmp/clt.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/clt.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          export ANDROID_HOME="$SDK"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          export PATH="$SDK/cmdline-tools/latest/bin:$PATH"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$HOME/.android/avd" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.android/avd"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          which java && java -version 2>&1 | head -1
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" \
            "emulator" \
            "system-images;android-${{ env.API_LEVEL }};${{ env.IMG_TAG }};${{ env.IMG_ABI }}" \
            > /tmp/sdkmanager.log 2>&1
          tail -5 /tmp/sdkmanager.log
          ls "$SDK/system-images/android-${{ env.API_LEVEL }}/${{ env.IMG_TAG }}/${{ env.IMG_ABI }}/"

      - name: Create AVD (+ small data partition for fast first-boot format)
        run: |
          set -euo pipefail
          echo "no" | avdmanager create avd -n "${{ env.AVD_NAME }}" \
            -k "system-images;android-${{ env.API_LEVEL }};${{ env.IMG_TAG }};${{ env.IMG_ABI }}" \
            -d pixel_5
          # The userdata partition size derives from the RAM config by default; a
          # multi-GB first-boot ext4 format under the emulator block layer dominates
          # cold-boot time. 2G comfortably fits the browser install + dexopt caches.
          CFG="$HOME/.android/avd/${{ env.AVD_NAME }}.avd/config.ini"
          if [ -f "$CFG" ]; then
            sed -i '/^disk.dataPartition.size/d' "$CFG"
            printf 'disk.dataPartition.size = 2G\n' >> "$CFG"
            echo "--- AVD config (key rows) ---"
            grep -E "dataPartition|ramSize|image.sysdir|hw.cpu" "$CFG" || true
          fi
          avdmanager list avd | head -12

      - name: Boot emulator (KVM, headless, software GL)
        run: |
          set -euo pipefail
          nohup "$ANDROID_HOME/emulator/emulator" \
            -avd "${{ env.AVD_NAME }}" \
            -accel on \
            -cores 4 \
            -gpu swiftshader_indirect \
            -no-window -no-audio -no-boot-anim -no-snapshot \
            -memory 4096 \
            > /tmp/emulator.log 2>&1 &
          echo "EMULATOR-LAUNCHED $(date -u +%FT%TZ)"
          sleep 10
          if ! pgrep -f "emulator.*${{ env.AVD_NAME }}" > /dev/null; then
            echo "EMULATOR-DIED-AT-LAUNCH - full log:"
            cat /tmp/emulator.log 2>/dev/null || true
            exit 1
          fi
          echo "EMULATOR-ALIVE-10s"
          sleep 20
          echo "--- emulator.log after 30s ---"
          tail -20 /tmp/emulator.log 2>/dev/null || true

      - name: Wait for full boot (sys.boot_completed=1)
        timeout-minutes: 30
        run: |
          set -euo pipefail
          for i in $(seq 1 240); do
            STATE=$(timeout 10 adb get-state 2>/dev/null | tr -d '\r' || true)
            if [ "$STATE" = "device" ]; then
              BOOT=$(timeout 15 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
              if [ "$BOOT" = "1" ]; then
                echo "BOOT-COMPLETED $(date -u +%FT%TZ) after ~$((i*7))s of polling"
                break
              fi
            fi
            if [ $((i % 12)) -eq 0 ]; then
              echo "poll ${i}: state=${STATE:-none} | emulator.log tail:"
              tail -4 /tmp/emulator.log 2>/dev/null || true
            fi
            sleep 7
            if [ "$i" = "240" ]; then
              echo "BOOT-TIMEOUT - emulator log tail:"
              tail -60 /tmp/emulator.log 2>/dev/null || true
              exit 1
            fi
          done
          timeout 20 adb devices -l

      - name: Diagnostics (always run)
        if: always()
        run: |
          echo "=== emulator.log tail (60) ==="
          tail -60 /tmp/emulator.log 2>/dev/null || true
          echo "=== adb devices ==="
          timeout 15 adb devices -l 2>/dev/null || true
          echo "=== guest boot prop (if reachable) ==="
          timeout 15 adb shell getprop sys.boot_completed 2>/dev/null || true
          echo "=== disk ==="
          df -h / || true

      - name: adb root + identity
        run: |
          set -euo pipefail
          adb root
          sleep 3
          adb wait-for-device
          adb shell id
          adb shell getprop ro.build.version.release
          adb shell getprop ro.product.cpu.abi
          adb shell cat /proc/meminfo | head -2

      - name: Fetch Chromium for Android snapshot (chrome-android.zip -> APK)
        run: |
          set -euo pipefail
          URL="https://commondatastorage.googleapis.com/chromium-browser-snapshots/Android/${{ env.CHROME_SNAPSHOT_REV }}/chrome-android.zip"
          echo "FETCH $URL"
          curl -fSLo /tmp/chrome-android.zip "$URL"
          ls -la /tmp/chrome-android.zip
          sha256sum /tmp/chrome-android.zip
          unzip -l /tmp/chrome-android.zip | head -15
          unzip -o -q /tmp/chrome-android.zip -d /tmp/chrome-android
          APK="$(find /tmp/chrome-android -name '*.apk' -type f | head -1)"
          [ -n "$APK" ] || { echo "NO APK inside chrome-android.zip"; exit 1; }
          echo "APK found: $APK"
          cp -v "$APK" /tmp/ChromePublic.apk
          ls -la /tmp/ChromePublic.apk
          sha256sum /tmp/ChromePublic.apk

      - name: Install ChromePublic.apk (KVM budget; generous timeout)
        timeout-minutes: 20
        run: |
          set -euo pipefail
          adb install -r -g /tmp/ChromePublic.apk 2>&1 | tee /tmp/install.log
          grep -q "Success" /tmp/install.log || { echo "INSTALL-FAILED"; exit 1; }
          echo "INSTALL-SUCCESS $(date -u +%FT%TZ)"

      - name: Verify install (package + version + activity resolve)
        run: |
          set -euo pipefail
          adb shell dumpsys package org.chromium.chrome | grep -E "versionName|versionCode|firstInstallTime|lastUpdateTime" | head -6
          adb shell cmd package resolve-activity --brief -c android.intent.category.LAUNCHER org.chromium.chrome | tail -2

      - name: Launch browser + capture evidence (generic smoke)
        run: |
          set -euo pipefail
          adb shell am start -n org.chromium.chrome/com.google.android.apps.chrome.Main \
            -d 'about:version' > /tmp/am_start.log 2>&1 || \
            adb shell monkey -p org.chromium.chrome -c android.intent.category.LAUNCHER 1 > /tmp/am_start.log 2>&1
          sleep 20
          adb shell screencap -p /sdcard/bringup_screen.png
          adb pull /sdcard/bringup_screen.png /tmp/bringup_screen.png || true
          adb shell "dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' | head -3" || true
          adb shell ps -A | grep -E "chrom" | head -5 || true

      - name: Clean shutdown (flush userdata for artifact)
        run: |
          set -euo pipefail
          adb emu kill || true
          for i in $(seq 1 30); do
            pgrep -f "emulator.*${{ env.AVD_NAME }}" > /dev/null || { echo "EMULATOR-EXITED cleanly"; break; }
            sleep 2
          done
          pgrep -f "emulator.*${{ env.AVD_NAME }}" && { echo "EMULATOR-STILL-RUNNING"; pkill -f "emulator.*${{ env.AVD_NAME }}" || true; sleep 5; } || true

      - name: Stage artifacts
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/avd-artifact" "$GITHUB_WORKSPACE/logs"
          cp -a "$HOME/.android/avd/${{ env.AVD_NAME }}.avd" "$GITHUB_WORKSPACE/avd-artifact/avd" 2>/dev/null || \
            cp -a "$HOME/.android/avd" "$GITHUB_WORKSPACE/avd-artifact/avd"
          cp /tmp/emulator.log /tmp/install.log /tmp/am_start.log "$GITHUB_WORKSPACE/logs/" 2>/dev/null || true
          cp /tmp/bringup_screen.png "$GITHUB_WORKSPACE/logs/" 2>/dev/null || true
          [ -f /tmp/ChromePublic.apk ] && sha256sum /tmp/ChromePublic.apk > "$GITHUB_WORKSPACE/logs/apk_sha256.txt"
          du -sh "$GITHUB_WORKSPACE/avd-artifact" "$GITHUB_WORKSPACE/logs"
          df -h / || true

      - name: Upload post-install AVD artifact (retention 14 days)
        uses: actions/upload-artifact@v4
        with:
          name: android-avd-postinstall
          path: avd-artifact/
          retention-days: 14
          if-no-files-found: error

      - name: Upload evidence logs
        uses: actions/upload-artifact@v4
        with:
          name: android-bringup-logs
          path: logs/
          retention-days: 30
          if-no-files-found: warn
